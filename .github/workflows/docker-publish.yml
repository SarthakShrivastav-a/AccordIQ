name: Publish Docker Image
on:
  pull_request:
    types: [closed]
    branches: [dev, main]
jobs:
  publish-image:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install config parser
        run: python -m pip install PyYAML
      - name: Resolve Docker image repository
        id: image
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path("config/app.yaml").read_text())
          print(f"repository={config['docker']['image_repository']}")
          PY
      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          base_ref="${{ github.event.pull_request.base.ref }}"
          if [ "$base_ref" = "main" ]; then
            echo "tags=${{ steps.image.outputs.repository }}:main-${short_sha},${{ steps.image.outputs.repository }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ steps.image.outputs.repository }}:dev-${short_sha},${{ steps.image.outputs.repository }}:dev-latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
