display_information:
  name: AccordIQ
  description: Turns Slack decisions and tasks into durable team memory.
features:
  bot_user:
    display_name: AccordIQ
    always_online: false
  slash_commands:
    - command: /accordiq
      description: Ask AccordIQ or manage capture controls.
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - commands
      - reactions:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
